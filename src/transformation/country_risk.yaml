# ===========================================================================
# Illustrative Country Risk Tier Reference Table
# ===========================================================================
# As of 30 October 2026. high = on the FATF black list or grey list, or subject to extensive sanctions.
#
# High-tier basis:
#   - KP, IR, MM: FATF black list
#   - AO, VN, KE, NP, LB, VE, HT: FATF grey list
#   - RU (Russia): not on the FATF black or grey list; in the EU high-risk third-country list since January 2026; FATF membership suspended
#
# Medium-tier basis:
#   - Emerging markets, regional trade/financial hubs
#     (e.g., BR, CN, IN, NG, PK, RO, UA, AR, CL, CO, EG, ID, MX, MY, PH, TH, ZA).
#
# Low-tier basis:
#   - Advanced economies with mature regulatory frameworks and low baseline risk 
#     (e.g., US, GB, CA, AU, DE, FR, JP, SG, AT, BE, CH, DK, ES, FI, IE, IT, KR, NL, NO, NZ, PL, SE).
# ===========================================================================

default_tier: "medium"

